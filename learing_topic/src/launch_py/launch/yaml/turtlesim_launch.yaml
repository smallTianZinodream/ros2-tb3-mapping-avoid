launch:
- node:
    pkg: turtlesim
    exec: turtlesim_node
    name: sim
    namespace: t1
    output: screen
- node:
    pkg: turtlesim
    exec: turtlesim_node
    name: sim
    namespace: t2
    output: screen
- timer:
    period: 2.0
    children:
    - executable:
        cmd: "ros2 topic pub --rate 10 /t1/turtle1/cmd_vel geometry_msgs/msg/Twist '{linear: {x: 0.0, y: 0.0, z: 0.0}, angular: {x: 0.0, y: 0.0, z: 1.5}}'"
        output: screen
    - executable:
        cmd: "ros2 topic pub --rate 10 /t2/turtle1/cmd_vel geometry_msgs/msg/Twist '{linear: {x: 0.0, y: 0.0, z: 0.0}, angular: {x: 0.0, y: 0.0, z: -1.5}}'"
        output: screen
